# Copy to wrangler.toml and fill in your own values. wrangler.toml is
# git-ignored because it names your account's database and domain.
name = "verisign"
main = "build/worker.mjs"
compatibility_date = "2026-10-01"

# Only answer on the custom domain: no *.workers.dev URL, no preview URLs.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "verisign.example.com", custom_domain = true },
]

[build]
command = "node scripts/build.mjs"
watch_dir = ["cmd", "internal"]

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "verisign"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
PUBLIC_ORIGIN = "https://verisign.example.com"
ISSUER_ORGANIZATION = "Example Research"
ISSUER_SIGNATORY = ""
ISSUER_ROLE = ""
ISSUER_URL = "https://example.com"

# OWNER_PASSWORD is a secret: `wrangler secret put OWNER_PASSWORD`.

[observability]
enabled = true
